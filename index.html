<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Formulário de Cadastro</h1>
    </header>
    <main>

        <form action="">
            <label for="nome">Nome e Sobrenome</label>
            <input type="text" id="nome" class="inputs-padrao">

            <label for="email">E-mail</label>
            <input type="text" id="email" class="inputs-padrao">

            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" class="inputs-padrao">

            <label for="mensagem">Mensagem</label>
            <textarea name="" id="mensagem" cols="68" rows="10"></textarea>

            <legend>Como prefere o nosso contato?</legend>
            <label for="radio-email"><input type="radio" name="" id="radio-email">e-mail</label>
            
            <label for="radio-telefone"> <input type="radio" name="" id="radio-telefone">telefone</label>
           
            <label for="radio-whatsapp"> <input type="radio" name="" id="radio-whatsapp">whatsapp</label>

            <select name="" id="">
                <option value="">Manhã</option>
                <option value="">Tarde</option>
                <option value="">Noite</option>
            </select>
           

            <label for="">  <input type="checkbox" name="" id="">Gostaria de receber nossas novidade por e-mail?</label>
          
            


            <input type="submit" value="Enviar">

        </form>
    </main>

    <footer></footer>

</body>

</html>
